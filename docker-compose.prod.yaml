services:
  # Em produção, todo o tráfego externo passa pelo Caddy.
  web:
    ports: !reset []
    networks:
      default: {}
      edge:
        ipv4_address: 172.29.240.3

  app:
    environment:
      FRONTEND_URL: ${FRONTEND_URL:-https://${SITE_DOMAIN}}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Defina SITE_DOMAIN com o domínio público do sistema}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    networks:
      edge:
        ipv4_address: 172.29.240.2

volumes:
  caddy-data:
  caddy-config:

networks:
  edge:
    ipam:
      config:
        - subnet: 172.29.240.0/29
