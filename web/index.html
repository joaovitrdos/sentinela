<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Sentinela - monitoramento de chuvas e rios do Brasil" />
        <meta name="theme-color" content="#0a0a0a" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..800;1,14..32,400..700&display=swap" rel="stylesheet" />

        <title>Sentinela</title>

        <script>
            // Aplica o tema antes do React montar para evitar o "flash" claro/escuro.
            // A chave precisa ser a mesma do ThemeProvider (ui-theme).
            try {
                var saved = localStorage.getItem("ui-theme");
                var dark = saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.classList.toggle("dark-mode", dark);
            } catch (e) {}
        </script>
    </head>

    <body class="size-full bg-primary antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
